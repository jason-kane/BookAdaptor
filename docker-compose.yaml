services:
  home:
    build:
      context: ./home
      additional_contexts:
        redis_panel: ./src/redis
    ports:
      - "8080:8080"
    volumes:
      - ./home:/app/home:ro
      - ./src/redis:/app/src/redis:ro
      - ./src/todo:/data/todo
      - ./docker-compose.yaml:/docker-compose.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - home-network

  redis:
    profiles: ["on-demand", "test"]
    image: redis:8.8
    ports:
      - "6379:6379"
    command: [ "redis-server", "--bind", "0.0.0.0", "--port", "6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 1s
      retries: 30
    networks:
      - home-network

  # chat:
  #   image: srwarenet/locallightchat:latest
  #   depends_on:
  #     - comfyui
  #   ports:
  #     - "6400:80"
  #   networks:
  #     - home-network
  redisinsight:
    profiles: ["on-demand"]
    image: redis/redisinsight:latest
    container_name: redis_dashboard
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - home-network
  nginx:
    profiles: ["on-demand"]
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./src/artifact_editor/static/:/var/www/static/:ro
      - ./htmlcov:/var/www/htmlcov
    depends_on:
      - artifactserver
      - home
      - comfyui
      - websocket
    networks:
      - home-network

  test:
    image: bookadaptor-app:latest
    # This runs _from_ the artifactserver container
    # (not kidding)
    profiles: ["test"]
    build:
      context: ./src/
      dockerfile: Dockerfile
    depends_on:
      - redis
    ports:
      - "8081:8080"
    entrypoint: [ "pytest", "--cov=artifact_editor", "--cov-report=html", "--maxfail=1", "-q" ]
    volumes:
      - /home/jkane/BookAdaptor/src/:/app/
      - /home/jkane/BookAdaptor/configuration.toml:/app/configuration.toml
      - /home/jkane/BookAdaptor/htmlcov:/app/htmlcov
      - /home/jkane/BookAdaptor/active-test:/active
      - /home/jkane/BookAdaptor/assets:/assets
      - /home/jkane/BookAdaptor/comfy/ComfyUI/input:/input
      - /home/jkane/BookAdaptor/comfy/ComfyUI/output:/output
      - /home/jkane/BookAdaptor/comfy/ComfyUI/user/default/workflows:/workflows
      - /home/jkane/BookAdaptor/templates:/templates
      - /home/jkane/BookAdaptor/comfy/ComfyUI/custom_nodes:/custom_nodes
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FORCE_COLOR=1
      - COLUMNS=160
      - CONTAINER_MODE=1
      - COMFYUI_WORKFLOWS_DIR=/workflows
      - COMFYUI_WORKFLOW_TEMPLATES_DIR=/templates
      - COMFYUI_INPUT_DIR=/root/ComfyUI/input
      - COMFYUI_OUTPUT_DIR=/root/ComfyUI/output
      - COMFYUI_API_URL=http://comfyui:8188/
      - COMFYUI_UI_URL=http://localhost:8188/
    networks:
      - home-network

  artifactserver:
    profiles: ["on-demand"]
    image: bookadaptor-app:latest
    build:
      context: ./src/
      dockerfile: Dockerfile
    depends_on:
      - redis
    ports:
      - "8082:8080"
    entrypoint: [ "gunicorn", "--reload", "--timeout", "600", "-w", "4", "--log-level", "info", "--capture-output", "--error-logfile", "-", "--access-logfile", "-" ]
    command: [ "--bind", "0.0.0.0:8080", "artifact_editor.app:create_app()" ]

    volumes:
      - ./src:/app
      - ./active:/active
      - ./active-test:/active-test
      - ./assets:/assets
      - ./comfy/ComfyUI/input:/input
      - ./comfy/ComfyUI/output:/output
      - ./comfy/ComfyUI/user/default/workflows:/workflows
      - ./templates:/templates
      - ./comfy/ComfyUI/custom_nodes:/custom_nodes
      - ./configuration.toml:/app/configuration.toml
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FORCE_COLOR=1
      - COLUMNS=160
      - CONTAINER_MODE=1
      - COMFYUI_WORKFLOWS_DIR=/workflows
      - COMFYUI_WORKFLOW_TEMPLATES_DIR=/templates
      - COMFYUI_INPUT_DIR=/root/ComfyUI/input
      - COMFYUI_OUTPUT_DIR=/root/ComfyUI/output
      - COMFYUI_API_URL=http://comfyui:8188/
      - COMFYUI_UI_URL=http://localhost:8188/
      - GPU_SERVICE_SWITCHING=1
      - COMFYUI_CONTAINER_NAME=comfyui-megapak
      - LLAMA_CONTAINER_NAME=llama-vision
      - LLAMA_API_URL=http://llama:8080
    networks:
      - home-network

  comfyui:
    profiles: ["on-demand"]
    init: true
    container_name: comfyui-megapak
    image: "comfyui-boot:cu130-megapak-pt211"
    command: [ "bash", "/runner-scripts/entrypoint.sh", "--listen", "0.0.0.0", "--enable-cors-header", '*' ]
    build:
      context: ./comfy/ComfyUI-Docker/cu130-megapak-pt211/
      dockerfile: Dockerfile
    ports:
      - "8188:8188"
    volumes:
      - "./dot-cache:/root/.cache"
      - "./dot-config:/root/.config"
      - "./dot-local:/root/.local"
      - "./user-scripts:/root/user-scripts"
      - "./comfy/ComfyUI:/root/ComfyUI"
      - "./comfy/ComfyUI/custom_nodes:/root/ComfyUI/custom_nodes"
      - "./comfy/ComfyUI/models:/root/ComfyUI/models"
      - "./comfy/ComfyUI/hf-hub:/root/.cache/huggingface/hub"
      - "./comfy/ComfyUI/torch-hub:/root/.cache/torch/hub"
      - "./comfy/ComfyUI/input:/root/ComfyUI/input"
      - "./comfy/ComfyUI/output:/root/ComfyUI/output"
      - "./comfy/ComfyUI/user:/root/ComfyUI/user"
      - "./comfy/ComfyUI/user-profile:/root/ComfyUI/user-profile"
      - "./comfy/ComfyUI_frontend/dist:/usr/local/lib/python3.13/site-packages/comfyui_frontend_package/static"
    environment:
      # Avoid dynamic allocator failures on tiny allocations with this image.
      # The entrypoint reads CLI_ARGS rather than forwarding command arguments.
      - CLI_ARGS=--enable-cors-header "*" --disable-dynamic-vram --fp8_e4m3fn-text-enc
    security_opt:
      # - "label=type:nvidia_container_t"
      - "label=disable"
      - "seccomp=unconfined"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - home-network

  # Llama.cpp serves Qwen3.5-9B Q5_K_M directly. It has a separate
  # profile so Compose never starts it beside ComfyUI on the shared GPU.
  llama:
    profiles: ["llama"]
    container_name: llama-vision
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - "--model"
      - "/models/Qwen_Qwen3.5-9B-Q5_K_M.gguf"
      - "--mmproj"
      - "/models/mmproj-Qwen3.5-9B-f16.gguf"
      - "--alias"
      - "Qwen3.5-9B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "99"
      - "--ctx-size"
      - "16384"
      - "--parallel"
      - "1"
      - "--reasoning-budget"
      - "1024"
      - "--reasoning-budget-message"
      - "The reasoning budget is finished. Produce the final response now."
    volumes:
      - ./comfy/ComfyUI/models/text_encoders:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - home-network

  websocket:
    profiles: ["on-demand"]
    image: bookadaptor-app:latest
    depends_on:
      - redis
    ports:
      - "5001:5001"
    volumes:
      - ./src/:/app
      - ./active:/active:ro
    environment:
      - GPU_SERVICE_SWITCHING=1
    entrypoint: [ "flask", "--app", "websocket.server", "run", "--host=0.0.0.0", "--port=5001" ]
    networks:
      - home-network

  video_worker:
    profiles: ["on-demand"]
    image: bookadaptor-app:latest
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: [ "python", "-m", "websocket.server", "worker" ]
    volumes: &worker-volumes
      - ./src:/app
      - ./active:/active
      - ./assets:/assets
      - ./comfy/ComfyUI/input:/input
      - ./comfy/ComfyUI/output:/output
      - ./comfy/ComfyUI/user/default/workflows:/workflows
      - ./templates:/templates
      - ./comfy/ComfyUI/custom_nodes:/custom_nodes
      - ./configuration.toml:/app/configuration.toml
      - /var/run/docker.sock:/var/run/docker.sock
    environment: &worker-environment
      - CONTAINER_MODE=1
      - COMFYUI_WORKFLOWS_DIR=/workflows
      - COMFYUI_WORKFLOW_TEMPLATES_DIR=/templates
      - COMFYUI_INPUT_DIR=/root/ComfyUI/input
      - COMFYUI_OUTPUT_DIR=/root/ComfyUI/output
      - COMFYUI_API_URL=http://comfyui:8188/
      - COMFYUI_UI_URL=http://localhost:8188/
      - GPU_SERVICE_SWITCHING=1
      - HOME_API_URL=http://home:8080
      - LLAMA_API_URL=http://llama:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - home-network

  # Coordinates asset preparation without occupying a GPU worker while waiting
  # for CPU frames or dependent LLM/image/audio workflows.
  render_worker:
    profiles: ["on-demand"]
    image: bookadaptor-app:latest
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["python", "-m", "render_worker"]
    volumes: *worker-volumes
    environment: *worker-environment
    networks:
      - home-network

  # The supervisor creates one worker process per available CPU core. This
  # service has no GPU reservation; frame tasks remain visible in Redis.
  cpu_worker:
    profiles: ["on-demand"]
    image: bookadaptor-app:latest
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["python", "-m", "cpu_queue"]
    volumes: *worker-volumes
    environment:
      CONTAINER_MODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    networks:
      - home-network

  glances:
    profiles: ["on-demand"]
    image: nicolargo/glances:ubuntu-latest-full
    restart: "no"
    pid: "host"
    privileged: false
    volumes:
      - "/:/rootfs:ro"
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/etc/os-release:ro
      - ./glances.conf:/app/glances/conf/glances.conf
    tmpfs:
      - /tmp
    ports:
      - "61208:61208"
      - "61209:61209"
    environment:
      - GLANCES_OPT=-C /app/glances/conf/glances.conf -w --disable-plugin ip --enable-mcp --enable-plugin gpu,smart
      - TZ=America/Los_Angeles
      - PYTHONPYCACHEPREFIX=/tmp/py_caches
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - home-network

networks:
  home-network:
    driver: bridge
