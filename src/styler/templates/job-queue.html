<aside id="styler-job-queue" data-queue-panel aria-label="GPU queue" aria-live="polite">
    <header class="styler-queue-header">
    <h2 data-queue-drag-handle tabindex="0" aria-label="Move GPU queue" title="Drag to move. Arrow keys move; Shift moves faster.">
        <span>GPU Queue</span>
        <wa-spinner id="styler-queue-loading" aria-label="Refreshing GPU queue"></wa-spinner>
        <span id="styler-queue-count" hidden></span>
        <wa-button id="styler-worker-reset" size="small" appearance="plain"
            aria-label="Queue worker reset" title="Queue a safe worker reset">
            <wa-icon name="rotate"></wa-icon>
        </wa-button>
        <div id="styler-gpu-provider" class="styler-gpu-provider" data-provider="unknown"
            role="group" aria-label="GPU provider state unknown" title="GPU provider state unknown">
            <button class="styler-gpu-provider-option" type="button" data-provider-option="comfyui"
                aria-label="Switch GPU to ComfyUI" title="Switch GPU to ComfyUI">
                <img src="/static/images/comfyui.svg" alt="" aria-hidden="true">
            </button>
            <button class="styler-gpu-provider-option" type="button" data-provider-option="llama"
                aria-label="Switch GPU to Llama" title="Switch GPU to Llama">🦙</button>
        </div>
        <span id="styler-worker-reset-status" role="status" aria-live="polite"></span>
        <wa-button id="styler-queue-toggle" size="small" appearance="plain"
            aria-label="Minimize GPU queue" aria-expanded="true" title="Minimize GPU queue">
            <wa-icon src="/static/fontawesome7/svgs/solid/chevron-down.svg"></wa-icon>
        </wa-button>
    </h2>
    <div class="styler-queue-rate" data-mode="walk">
        <wa-slider id="styler-maintenance-rate" aria-label="Background task rate"
            min="0" max="2" step="1" value="1" size="small" with-markers with-tooltip disabled>
        </wa-slider>
        <div class="styler-queue-rate-labels" aria-hidden="true">
            <span data-rate-mode="off">Off</span><span data-rate-mode="walk">Walk</span><span data-rate-mode="run">Run</span>
        </div>
    </div>
    </header>
    <div class="styler-queue-body">
        <div class="styler-queue-body-inner">
            <div id="styler-queue-current"></div>
            <div id="styler-queue-near"></div>
            <div id="styler-queue-overflow" hidden></div>
        </div>
    </div>
</aside>
