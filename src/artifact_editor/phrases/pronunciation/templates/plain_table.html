<table id="global_pronunciation" class="wa-zebra-rows wa-hover-rows pronunciation-table">
    <colgroup>
        <col class="pronunciation-word-column">
        <col>
        <col class="pronunciation-action-column">
    </colgroup>
    <thead>
        <tr>
            <th>Word</th>
            <th>IPA Pronunciation</th>
            <th aria-label="Actions"></th>
        </tr>
    </thead>

{% for word in global_pronunciation_list %}
    {% include "plain_row.html" %}
{% endfor %}

    <tr>
        <td><wa-input class="pronunciation-table-input" name="add_word" placeholder="Word"></wa-input></td>
        <td><wa-input class="pronunciation-table-input" name="add_pron" placeholder="IPA Pronunciation"></wa-input></td>
        <td class="pronunciation-table-action"><wa-button
                hx-post="{{add_global_pronunciation_url}}"
                hx-target="#global_pronunciation"
                hx-include="[name='add_word'], [name='add_pron']"
                hx-swap="outerHTML">Add</wa-button></td>
    </tr>
</table>
