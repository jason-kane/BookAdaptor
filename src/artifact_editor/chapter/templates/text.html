{% extends "base.html" %}

{% block title %}
<title>Chapter: {{ chapter_title }}</title>
{% endblock %}

{% block styles %}
<style>
    #text_editor {
        width: 27em;
    }
    .ql-editor {
        font-size: 16px;
    }

    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value]::before {
        content: attr(data-value) !important;
    }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value]::before {
        content: attr(data-value) !important;
    }    
 
    .ql-snow .ql-picker.ql-font {
        width: 150px !important;
        white-space: nowrap;
    }
</style>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
    const fontFamilyArr = ["Roboto Condensed", "Times New Roman", "Calibri", "Calibri Light", "Sans-Serif"];
    let fonts = Quill.import("attributors/style/font");
    fonts.whitelist = fontFamilyArr;
    Quill.register(fonts, true);

    const fontSizeArr = ['10px', '11px', '12px', '14px', '18px', '24px'];
    var Size = Quill.import('attributors/style/size');
    Size.whitelist = fontSizeArr;
    Quill.register(Size, true);
</script>

<script type="module">
    // import Quill from "/static/js/quill.js";
    const Parchment = Quill.import('parchment');
    
    let Phrase = new Parchment.Attributor('phrase', 'phrase', {
        scope: Parchment.Scope.INLINE,
    });
    Quill.register(Phrase, true);

    window.previous_phrase_index = -1;

    // const fontFamilyArr = ["Roboto Condensed", "Times New Roman", "Calibri", "Calibri Light", "Sans-Serif"];
    // let fonts = Quill.import("attributors/style/font");
    // fonts.whitelist = fontFamilyArr;
    // Quill.register(fonts, true);

    // const fontSizeArr = ['10px', '11px', '12px', '14px', '18px', '24px'];
    // var Size = Quill.import('attributors/style/size');
    // Size.whitelist = fontSizeArr;
    // Quill.register(Size, true);

    //const speakerArr = ['Narrator', 'Mel', 'New Character'];
    // const speakerConfig = {
    //     scope: Parchment.Scope.INLINE,
    //     whitelist: speakerArr
    // };
    // let SpeakerStyle = new Parchment.Attributor('speaker', 'speaker', speakerConfig);
    // let SpeakerWrapper = new Parchment.ClassAttributor('speaker', 'speaker', {
    //     scope: Parchment.Scope.INLINE,
    //     whitelist: speakerArr
    // });
    // Quill.register(SpeakerWrapper, true);
    
    //     scope: Parchment.Scope.INLINE,
    // });
    // const SpeakerStyle = new Parchment.Attributor.Style(
    //     'speaker',  // attribute name
    //     'speaker', // css property name
    //     speakerConfig
    // );

    let text_editor = null;
    let text_editor_title = null;

    // Wait for the DOM to finish loading
    document.addEventListener('DOMContentLoaded', () => {
        if (!text_editor_title) {
            text_editor_title = new Quill('#text_editor_title', {
                modules: {
                    syntax: true,
                    toolbar: [
                        // only include features supported through to Latex.
                        [{ 'font': fontFamilyArr }, {'size': fontSizeArr }],
                        ['bold', 'italic'], // 'underline', 'strike'], // toggled buttons
                        [
                            { align: ''}, 
                            { align: 'center' }, 
                            // { align: 'right' },
                            { align: 'justify' }
                        ], // text alignment
                        // ['color', 'background'], // defaults from theme
                        // ['blockquote', 'code-block'], // blockquote, code block
                        // [{'list': 'ordered'}, {'list': 'bullet'}], // lists and indentation
                        // ['link'], // links
                        // ['blockquote', 'code-block'],
                    ]
                },
                theme: 'snow'
            });

            // Listen for text changes in the Quill editor and auto-save
            // https://quilljs.com/docs/api#text-change
            text_editor_title.on('text-change', (delta, oldDelta, source) => {
                // Right now _every_ change is being sent to the server.  
                // This is a little ridiculous.  If we can soak and bundle
                // changes for a few seconds, that would be less noisy.
                htmx.ajax('POST', 'title_delta', {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    values: {
                        delta: JSON.stringify(text_editor_title.getContents()),
                    },
                    swap: 'none',
                    onError: function (err) {
                        console.error('Error updating:', err);
                    }
                });
            });
        }

        if (!text_editor) {
            text_editor = new Quill('#text_editor', {
                modules: {
                    syntax: true,
                    toolbar: {
                        container: [
                            [{ 'font': fontFamilyArr }, {'size': fontSizeArr }],
                            ['bold', 'italic'], // 'underline', 'strike'], // toggled buttons
                            [
                                { align: ''}, 
                                { align: 'center' }, 
                                // { align: 'right' },
                                { align: 'justify' }
                            ], // text alignment
                            //[{'speaker': speakerArr}],
                        ],
                        // handlers: {
                        //     'speaker': function(value) {
                        //         const range = this.quill.getSelection();
                                
                        //         if (range && range.length > 0) {
                        //             if (value === 'New Character') {
                        //                 // this.quill.format('speaker', );
                        //                 // new character model
                        //             } else {
                        //                 this.quill.formatText(range.index, range.length, 'speaker', value);
                        //             }
                        //             this.quill.insertText(range.index, 'speaker');
                        //         }
                        //     }
                        // }
                    }                        // only include features supported through to Latex.
                        
                        // ['color', 'background'], // defaults from theme
                        // ['blockquote', 'code-block'], // blockquote, code block
                        // [{'list': 'ordered'}, {'list': 'bullet'}], // lists and indentation
                        // ['link'], // links
                        // ['blockquote', 'code-block'],
                    
                },
                theme: 'snow'
            });

            // Listen for text changes in the Quill editor and auto-save
            // https://quilljs.com/docs/api#text-change
            text_editor.on('text-change', (delta, oldDelta, source) => {
                // Right now _every_ change is being sent to the server.  
                // This is a little ridiculous.  If we can soak and bundle
                // changes for a few seconds, that would be less noisy.
                htmx.ajax('POST', 'delta', {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    values: {
                        delta: JSON.stringify(text_editor.getContents()),
                    },
                    swap: 'none',
                    onError: function (err) {
                        console.error('Error updating:', err);
                    }
                });
            });

            // const speakerPickerItems = Array.prototype.slice.call(document.querySelectorAll('.ql-speaker .ql-picker-item'));

            // speakerPickerItems.forEach(item => item.textContent = item.dataset.value);

            // document.querySelector('.ql-speaker .ql-picker-label').innerHTML
            //     = 'Choose Speaker' + document.querySelector('.ql-speaker .ql-picker-label').innerHTML;            

        }

        // Retrieve the current chapter content
        htmx.ajax('GET', 'delta', {
          source: '#text_editor',
          swap: 'none',
          handler: function(target, info) {
            if (info.xhr.status === 200) {
              text_editor.setContents(JSON.parse(info.xhr.responseText));
            } else {
              console.error('Error fetching todo:', info.xhr.statusText);
            }
          }
        });

        // Retrieve the current chapter title content
        htmx.ajax('GET', 'title_delta', {
          source: '#text_editor_title',
          swap: 'none',
          handler: function(target, info) {
            if (info.xhr.status === 200) {
              text_editor_title.setContents(JSON.parse(info.xhr.responseText));
            } else {
              console.error('Error fetching todo:', info.xhr.statusText);
            }
          }
        });

    });
</script>
<script src="/static/js/pdf.mjs" type="module"></script>
<script src="/static/js/typography.js"></script>

<script type="module">
    // wait until the DOM is loaded before trying to access the canvas element
    document.addEventListener("DOMContentLoaded", function () {
        var { pdfjsLib } = globalThis;
        // The workerSrc property shall be specified.
        // this is why we're a module.
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/js/pdf.worker.mjs';
        
        // initialize the pdf rendering
        latex_rerender_url("{{ chapter_pdf_url }}");
    });
</script>
{% endblock %}

{% block body %}

<div class="wa-cluster wa-align-items-start" style="gap: 32px;">
    <div class="wa-stack wa-gap-0">
        <div 
            id="text_editor_title" 
            class="text-editor"
            style="height: 13em;">
        </div>

        <div>
            <div 
                id="text_editor" 
                class="text-editor"
                style="height: 47em;">
            </div>
        </div>

        <div class="wa-cluster">
            <wa-button 
                id="reflow_btn" 
                hx-put="{{ url_for('library.book.chapter.reflow_paragraphs') }}""
                hx-on::before-request="beforeRequest(this,event)"
                hx-on::after-request="afterRequest(this,event)"
                hx-swap="none" 
                variant="neutral" 
                appearance="accent" 
                size="medium" 
            >Reflow Paragraphs</wa-button>

            {{import_button|safe}}
        </div>
    </div>
    <div id="phrase-stack" class="wa-stack wa-gap-0" style="width: 35%;">
        {% for phrase in phrases %} 
            <wa-textarea 
                id="phrase_{{ phrase.attrs['index'] }}" 
                class="phrase-editor"
                hx-get="{{ url_for('library.book.chapter.phrase_editor', phrase_index=phrase.attrs['index']) }}"
                hx-vals='js:{"previous_phrase_index": window.previous_phrase_index }'
                hx-trigger="click"
                hx-swap="none"
                value="{{ phrase.attrs.get('delta') }}"
            ></wa-textarea>
        {% endfor %}
    </div>
    <div class="wa-stack">   
        <div style="width:523px;height:46em;overflow-y:scroll;">
            <canvas id="the-canvas"></canvas>
        </div>
    </div>

</div>

<div id="js-executor">
    <script></script>
</div>
{% endblock %}
