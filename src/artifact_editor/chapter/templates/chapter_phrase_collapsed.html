<wa-textarea
    id="phrase_{{ phrase.index }}_ta" class="phrase-editor"
    hx-get="{{ url_for('library.book.chapter.phrase_editor', phrase_index=phrase.index) }}"
    hx-vals='js:{"previous_phrase_index": window.previous_phrase_index}'
    hx-trigger="click" hx-swap="none" hx-swap-oob="true"
    value="{{ phrase.simple_text() }}"
></wa-textarea>
<div id="chapter-audio-controls-{{ phrase.index }}" class="wa-stack wa-gap-xs" hx-swap-oob="true"></div>
<div id="js-executor" hx-swap-oob="true">
    <script>
        document.getElementById('phrase_{{ phrase.index }}')?.classList.remove('selected');
        document.querySelectorAll('#phrase_{{ phrase.index }} .ql-toolbar').forEach(toolbar => toolbar.remove());
        if (String(window.previous_phrase_index) === '{{ phrase.index }}') {
            window.previous_phrase_index = -1;
        }
    </script>
</div>
