<div id="character_cards">
    <wa-tab-group{% if character_tabs %} active="character-0"{% else %} active="new"{% endif %}>
        {% for character in character_tabs %}
        <wa-tab panel="character-{{ loop.index0 }}">{{ character.name }}</wa-tab>
        {% endfor %}
        <wa-tab panel="new">New</wa-tab>
        {% for character in character_tabs %}
        <wa-tab-panel name="character-{{ loop.index0 }}">{{ character.card|safe }}</wa-tab-panel>
        {% endfor %}
        <wa-tab-panel name="new">
            <h2>Create New Character</h2>
            <div
                style="border: 1px solid #e0e0e0; padding: 16px; border-radius: var(--wa-border-radius-m); position: relative;"
                id="character_add_form"
            >
                <div>
                    <form id="character_add_scope">
                        <wa-input
                            label="Character Name:"
                            name="name"></wa-input>

                        <wa-textarea
                            label="Description:"
                            name="description"
                            id="character_add_description"
                            rows="6"
                        ></wa-textarea>

                        <wa-select
                            label="TTS Engine"
                            name="tts_engine"
                            value="kokoro">
                            <wa-option value="kokoro">Kokoro</wa-option>
                        </wa-select>
            
                        <wa-button
                            class="save-character-button"
                            hx-post="{{ url_for('library.book.chapter.characters.add_character', author=chapter.author.name, title=chapter.title, chapter_number=chapter.number, language=chapter.language) }}"
                            hx-target="#character_cards"
                            hx-include="#character_add_scope"
                            hx-on::before-request="beforeRequest(this,event)"
                            hx-on::after-request="afterRequest(this,event)"
                            hx-swap="outerHTML transition:true">Save New Character</wa-button>
                    </form>
                </div>
            </div>

            {{ drift_resolution_widget|safe }}

            {{ import_character_form|safe }}
        </wa-tab-panel>
    </wa-tab-group>
</div>
