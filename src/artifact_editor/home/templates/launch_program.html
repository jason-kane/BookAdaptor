<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening {{ program.name }}</title>
    <style>
      body { color-scheme: dark; background: #17151c; color: #eee; font: 1.1rem system-ui; max-width: 36rem; margin: 15vh auto; padding: 1rem; }
      a { color: #cbb5ff; }
      button { font: inherit; padding: .5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>{{ program.name }}</h1>
    <p id="status" role="status">Starting {{ program.name }}…</p>
    <button id="retry" hidden>Try again</button>
    <p><a href="/">Back to home</a></p>
    <noscript>JavaScript is needed to start {{ program.name }} from this page.</noscript>
    <script>
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      async function launch() {
        retry.hidden = true;
        status.textContent = {{ ('Starting ' ~ program.name ~ '…') | tojson }};
        try {
          const started = await fetch({{ start_url | tojson }}, {method: 'POST'});
          if (!started.ok) throw new Error({{ ('Unable to start ' ~ program.name ~ '. Please try again.') | tojson }});
          const deadline = Date.now() + 90000;
          while (Date.now() < deadline) {
            const response = await fetch({{ status_url | tojson }}, {cache: 'no-store'});
            if (!response.ok) throw new Error({{ ('Unable to check ' ~ program.name ~ '. Please try again.') | tojson }});
            if ((await response.json()).ready) {
              const destination = new URL(window.location.href);
              destination.port = {{ program.port | string | tojson }};
              destination.pathname = '/';
              destination.search = '';
              destination.hash = '';
              window.location.replace(destination.href);
              return;
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          throw new Error({{ (program.name ~ ' is taking longer than expected. Please try again.') | tojson }});
        } catch (error) {
          status.textContent = error.message;
          retry.hidden = false;
        }
      }
      retry.addEventListener('click', launch);
      launch();
    </script>
  </body>
</html>
